name: Deploy Shinylive App

on:
  push:
    branches: [ main, master ]
    paths:
      - 'SHINY_APP/**'
      - 'guides/**'
      - '*.md'
      - 'render_docs.R'
      - '.github/workflows/deploy-shinylive.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          install.packages(c("shiny", "shinylive", "data.table", "ggplot2", "plotly", "commonmark"))
        shell: Rscript {0}

      - name: Export Shinylive site
        run: |
          mkdir -p SHINY_APP/guides
          cp guides/*.md SHINY_APP/guides/
          Rscript -e '
            shinylive::export(
              appdir = "SHINY_APP", 
              destdir = "site",
              template_params = list(
                title = "MafA Discovery: Integrated Genomic Explorer",
                include_in_head = "<link rel=\"icon\" href=\"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>\">"
              )
            )
          '
          rm -rf SHINY_APP/guides
        shell: bash

      - name: Render HTML documentation & copy to site
        run: |
          Rscript render_docs.R
          mkdir -p site/docs
          cp docs/*.html site/docs/
          for f in docs/*.html; do
            if [ "$(basename "$f")" != "index.html" ]; then
              cp "$f" site/
            fi
          done
          sed -i.bak 's|<title>Shiny App</title>|<title>MafA Discovery: Integrated Genomic Explorer</title>|g' site/index.html 2>/dev/null || true
          rm -f site/index.html.bak 2>/dev/null || true
          cp DEVELOPER.md guides/*.md site/ 2>/dev/null || true
        shell: bash

      - name: Disable Jekyll for GitHub Pages
        run: touch site/.nojekyll
        shell: bash

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
